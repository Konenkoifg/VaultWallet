<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VaultWallet</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script src="https://unpkg.com/@tonconnect/ui@2.3.0/dist/tonconnect-ui.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-top: 10px;
      font-size: 28px;
    }

    .card {
      background: #151b23;
      border-radius: 20px;
      padding: 20px;
      margin-top: 16px;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
      margin-top: 10px;
    }

    .asset {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #29313d;
    }

    .asset:last-child {
      border-bottom: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .connect {
      background: #0098ea;
      color: white;
    }

    .action {
      background: #202833;
      color: white;
    }

    .address {
      word-break: break-all;
      font-size: 12px;
      color: #8d99a8;
      margin-top: 15px;
    }

    .status {
      color: #8d99a8;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>VaultWallet</h1>

  <div class="card">

    <div>Общий баланс</div>

    <div class="balance">
      $0.00
    </div>

    <div class="asset">
      <span>TON</span>
      <span id="tonBalance">0 TON</span>
    </div>

    <div class="asset">
      <span>USDT</span>
      <span id="usdtBalance">0 USDT</span>
    </div>

  </div>

  <div class="card">

    <h3>Кошелёк</h3>

    <div id="ton-connect"></div>

    <div id="status" class="status">
      Кошелёк не подключён
    </div>

    <div id="address" class="address"></div>

  </div>

  <div class="card">

    <button class="action">
      Получить
    </button>

    <button class="action">
      Отправить
    </button>

    <button class="action">
      Обменять
    </button>

    <button class="action">
      История
    </button>

  </div>

</div>

<script>

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl:
      'https://konenkoifg.github.io/VaultWallet/tonconnect-manifest.json',

    buttonRootId: 'ton-connect'
  });

  tonConnectUI.onStatusChange(wallet => {

    const status = document.getElementById('status');
    const address = document.getElementById('address');

    if (wallet) {

      status.innerText = 'Кошелёк подключён';

      address.innerText =
        'Адрес: ' + wallet.account.address;

    } else {

      status.innerText =
        'Кошелёк не подключён';

      address.innerText = '';

    }

  });

</script>

</body>
</html>
